onboarding = false

[ui]
# Don't copy mouse selections to the clipboard
copy_on_select = false
# sidebar (agents and spaces) width in columns; default 26, minimum 18
sidebar_width = 20
status_indicators = "symbols"

[theme]
# Follow the terminal's light/dark mode (Rio switches with macOS)
auto_switch = true
dark_name = "catppuccin"
light_name = "catppuccin-latte"

[ui.toast]
delivery = "herdr"

[keys]
navigate_workspace_up = "k"
navigate_workspace_down = "j"
