onboarding = false

[ui]
# Don't copy mouse selections to the clipboard
copy_on_select = false
# sidebar (agents and spaces) width in columns; default 26, minimum 18
sidebar_width = 20
status_indicators = "symbols"

[theme]
# seoul256, same as https://github.com/bewa1t/seoul256-herdr (change both).
# herdr has no theme files, so every color token is set below; it switches with
# the terminal's light/dark mode (Rio).
# Not the "terminal" theme: it draws muted text in ANSI white, which is lighter
# than the background in seoul256-light.
auto_switch = true

[theme.custom]
sidebar_bg = "reset"

[theme.custom.dark]
text = "#D9D9D9"
subtext0 = "#BFBFBF"
overlay1 = "#A8A8A8"
overlay0 = "#929292"
panel_bg = "#3F3F3F"
active_row_bg = "#565656"
selection_bg = "#007173"
surface0 = "#565656"
surface1 = "#616161"
surface_dim = "#565656"
accent = "#98BEDE"
blue = "#98BEDE"
teal = "#97DDDF"
green = "#98BC99"
yellow = "#DFBC72"
peach = "#E19972"
red = "#E17899"
mauve = "#E0BEBC"

[theme.custom.light]
text = "#616161"
subtext0 = "#6B6B6B"
overlay1 = "#757575"
overlay0 = "#8A8A8A"
panel_bg = "#FFFFFF"
active_row_bg = "#E1E1E1"
selection_bg = "#BCDEDE"
surface0 = "#E1E1E1"
surface1 = "#D9D9D9"
surface_dim = "#E9E9E9"
accent = "#7299BC"
blue = "#7299BC"
teal = "#009799"
green = "#719872"
yellow = "#9A7200"
peach = "#E19972"
red = "#BF2172"
mauve = "#9A7599"

[ui.toast]
delivery = "herdr"

[keys]
navigate_workspace_up = "k"
navigate_workspace_down = "j"
