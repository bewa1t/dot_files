# Same look as alacritty/alacritty.toml.

# Don't copy mouse selections to the clipboard
copy-on-select = false

# Rio switches these itself with macOS light/dark mode (no theme-sync needed).
[adaptive-theme]
light = "catppuccin-latte"
dark = "catppuccin-mocha"

[fonts]
family = "JetBrainsMono Nerd Font"
size = 13

[window]
columns = 250
rows = 100
