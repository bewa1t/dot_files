theme = "auto"

[editor]
default-yank-register = "+"
line-number = "relative"
cursorline = true
color-modes = true
bufferline = "multiple"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true

# space L: copy "file:line" (or "file:start-end" for a multi-line selection)
# to the macOS clipboard
[keys.normal.space]
L = ':echo %sh{~/.config/helix/copy-file-ref "%{buffer_name}" %{selection_line_start} %{selection_line_end}}'

[keys.select.space]
L = ':echo %sh{~/.config/helix/copy-file-ref "%{buffer_name}" %{selection_line_start} %{selection_line_end}}'
