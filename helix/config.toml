theme = "auto"

[editor]
default-yank-register = "+"
# Don't copy mouse selections to the clipboard (also disables middle-click paste)
middle-click-paste = false
line-number = "relative"
cursorline = true
color-modes = true
bufferline = "multiple"

[editor.soft-wrap]
enable = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true

# space L: copy "file:line" (or "file:start-end" for a multi-line selection)
# to the macOS clipboard
[keys.normal.space]
L = { label = "Copy path + line range", command = ':echo %sh{~/.config/helix/copy-file-ref "%{buffer_name}" %{selection_line_start} %{selection_line_end}}' }

[keys.select.space]
L = { label = "Copy path + line range", command = ':echo %sh{~/.config/helix/copy-file-ref "%{buffer_name}" %{selection_line_start} %{selection_line_end}}' }
